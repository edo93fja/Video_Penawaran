name: Render video penawaran

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: vid, nama, niche, kategori, urls'
        required: true
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pasang ffmpeg dan Chromium
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install playwright==1.49.1 requests==2.32.3
          python -m playwright install --with-deps chromium

      - name: Render video
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: python render/render.py

      - name: Hapus video lebih dari 14 hari
        run: |
          now=$(date +%s)
          for f in video/*.mp4; do
            [ -e "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f" 2>/dev/null)
            [ -n "$t" ] || continue
            if [ $((now - t)) -gt 1209600 ]; then git rm -q -f "$f"; fi
          done

      - name: Simpan ke repo
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add video
          git commit -m "video: ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
